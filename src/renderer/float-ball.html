<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>传输悬浮球</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f4f6fb; --text: #151922; --text2: #5b6475;
    --border: rgba(21,25,34,.12); --primary: #336df4; --ok: #199e63; --warn: #d9820c;
  }
  [data-theme="dark"] {
    --bg: #181c24; --bg2: #222836; --text: #eef1f6; --text2: #9aa4b5;
    --border: rgba(255,255,255,.12); --primary: #5b8cff; --ok: #34d399; --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .ball {
    width: 100%; height: 100%;
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); background: var(--bg);
  }
  .orb {
    position: relative; width: 42px; height: 42px; flex: none;
    border-radius: 50%; display: grid; place-items: center;
    background: var(--bg2); color: var(--primary); cursor: grab;
  }
  .orb svg.ring { position: absolute; inset: 0; width: 42px; height: 42px; transform: rotate(-90deg); }
  .orb circle.track { fill: none; stroke: var(--border); stroke-width: 3; }
  .orb circle.prog { fill: none; stroke: var(--primary); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .22s ease; }
  .orb.done circle.prog { stroke: var(--ok); }
  .orb-ic { font-size: 13px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .info { flex: 1; min-width: 0; cursor: grab; }
  .speed { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .acts { display: flex; align-items: center; gap: 4px; flex: none; }
  .ib {
    width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg2); color: var(--text2); cursor: pointer;
    display: grid; place-items: center; font-size: 12px; line-height: 1;
    transition: background .12s, color .12s, border-color .12s;
  }
  .ib:hover { color: var(--primary); border-color: var(--primary); }
</style>
</head>
<body>
  <div class="ball" data-tauri-drag-region>
    <div class="orb" id="orb" data-tauri-drag-region title="按住拖动悬浮球">
      <svg class="ring" viewBox="0 0 42 42" aria-hidden="true">
        <circle class="track" cx="21" cy="21" r="18"></circle>
        <circle class="prog" id="ring-prog" cx="21" cy="21" r="18" stroke-dasharray="113.1" stroke-dashoffset="113.1"></circle>
      </svg>
      <span class="orb-ic" id="orb-label"> idle </span>
    </div>
    <div class="info" data-tauri-drag-region>
      <div class="speed" id="speed" data-tauri-drag-region>传输空闲</div>
      <div class="meta" id="meta" data-tauri-drag-region>点击右侧展开主窗口</div>
    </div>
    <div class="acts">
      <button type="button" class="ib" id="btn-main" title="打开传输列表">↗</button>
      <button type="button" class="ib" id="btn-close" title="关闭悬浮球">×</button>
    </div>
  </div>
  <script src="float-ball.js"></script>
</body>
</html>
