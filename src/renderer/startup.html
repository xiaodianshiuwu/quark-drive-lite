<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>夸克网盘 · 极简版</title>
  <style>
    :root { --bg: #f5f7fb; --fg: #181c24; --sub: #647084; --accent: #3b73f7; --track: rgba(59,115,247,.16); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151b; --fg: #eef1f6; --sub: #94a0b4; --accent: #5b8cff; --track: rgba(91,140,255,.22); }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 420px; padding: 32px; text-align: center; }
    .ring { width: 32px; height: 32px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--accent); animation: spin .75s linear infinite; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
    p { margin: 0; line-height: 1.6; color: var(--sub); font-size: 13.5px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true"></div>
    <h1>正在打开夸克网盘</h1>
    <p>正在读取本机登录资料并初始化客户端…</p>
  </main>
</body>
</html>
