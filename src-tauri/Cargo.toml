[package]
name = "quark-drive-lite-tauri"
version = "1.0.2"
edition = "2021"
license = "MIT"
default-run = "quark-drive-lite-tauri"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
quark-core = { path = "../crates/quark-core" }
quark-transfer = { path = "../crates/quark-transfer" }
quark-agent = { path = "../crates/quark-agent" }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
open = "5"
fs2 = "0.4"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "=0.16.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
zbus = "=5.19.0"
