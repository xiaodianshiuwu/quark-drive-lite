name: CI checks (Tauri 2 + Rust)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libfuse2 librsvg2-dev libayatana-appindicator3-dev \
            xvfb dbus-x11 openbox xdotool wmctrl imagemagick desktop-file-utils fonts-noto-cjk thunar weston python3-gi
      - run: npm ci --ignore-scripts
      - run: npm run check:js
      - run: cargo test --workspace --locked
      - name: Require Chrome on Linux and Intel macOS
        if: runner.os == 'Linux' || matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            chrome=$(command -v google-chrome)
          else
            chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          fi
          "$chrome" --version
          echo "QCK_BROWSER_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm test
      - name: Compile native app (no publication)
        if: runner.os == 'macOS' && matrix.os != 'macos-15-intel'
        run: npx tauri build --no-bundle
      - name: Build and validate Windows NSIS and Portable packages
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $ErrorActionPreference = 'Stop'
          npx tauri build --bundles nsis -- --locked
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $outDir = Join-Path $PWD "windows-packages"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $nsisFiles = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe"
          if ($nsisFiles.Count -ne 1) { throw "Expected 1 NSIS setup exe, found $($nsisFiles.Count)" }
          $setupDest = Join-Path $outDir "QuarkDriveLite-$version-Windows-x64-Setup.exe"
          Copy-Item $nsisFiles[0].FullName $setupDest -Force

          $exePath = Join-Path $PWD "target/release/quark-drive-lite-tauri.exe"
          if (-not (Test-Path $exePath)) { throw "Missing release exe at $exePath" }
          $portableStage = Join-Path $env:TEMP "qdl-portable-$version"
          if (Test-Path $portableStage) { Remove-Item $portableStage -Recurse -Force }
          $folderName = "夸克网盘极简版-v$version-便携版"
          $stageInner = Join-Path $portableStage $folderName
          New-Item -ItemType Directory -Force -Path $stageInner | Out-Null
          Copy-Item $exePath (Join-Path $stageInner "夸克网盘极简版.exe") -Force
          @"
          夸克网盘 · 极简版 v$version（Windows x64 便携版）
          ==========================================
          1. 双击「夸克网盘极简版.exe」即可运行，无需安装。
          2. 需要 Windows 10/11 系统自带的 Microsoft Edge WebView2 运行时。
          3. 本应用支持文件夹递归批量下载、云解压、文件夹大小统计及意见反馈进度追踪。
          "@ | Set-Content -Path (Join-Path $stageInner "使用说明.txt") -Encoding UTF8

          $zipDest = Join-Path $outDir "QuarkDriveLite-$version-Windows-x64-Portable.zip"
          python -c "import zipfile, pathlib, sys; root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); zf=zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED); [zf.write(p, p.relative_to(root).as_posix()) for p in sorted(root.rglob('*')) if p.is_file()]; zf.close()" $portableStage $zipDest

          $sums = @()
          foreach ($f in @($setupDest, $zipDest)) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $sums += "$h  $(Split-Path $f -Leaf)"
          }
          $sums | Set-Content -Path (Join-Path $outDir "SHA256SUMS-Windows.txt") -Encoding ASCII
          Get-ChildItem $outDir | Format-Table Name, Length
      - name: Save Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quark-drive-lite-windows-x64
          path: windows-packages/
          if-no-files-found: error
      - name: Test native WebKitGTK and Tauri IPC
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: dbus-run-session -- xvfb-run -a npm run verify:native
      - name: Test Linux desktop operations on X11
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x980x24" bash scripts/linux-desktop-smoke.sh target/debug/quark-drive-lite-tauri .work/linux-desktop-smoke.json
      - name: Test native WebKitGTK over Wayland
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_RUNTIME_DIR=$(mktemp -d)
            export GDK_BACKEND=wayland WAYLAND_DISPLAY=qdl-qa
            unset DISPLAY
            weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >.work/weston.log 2>&1 &
            compositor=$!
            trap '"'"'kill "$compositor" 2>/dev/null || true; rm -rf "$XDG_RUNTIME_DIR"'"'"' EXIT
            for attempt in {1..30}; do
              test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
              sleep 0.2
            done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            cp .work/native-smoke.json .work/linux-x11-smoke.json
            npm run verify:native
            mv .work/native-smoke.json .work/linux-wayland-smoke.json
          '
      - name: Build and validate Linux packages
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run build -- -- --locked
          mkdir -p linux-packages linux-qa
          shopt -s nullglob
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          test "${#deb[@]}" -eq 1
          test "${#appimage[@]}" -eq 1
          version=$(node -p "require('./package.json').version")
          deb_asset="$PWD/linux-packages/QuarkDriveLite-$version-Linux-x64.deb"
          appimage_asset="$PWD/linux-packages/QuarkDriveLite-$version-Linux-x64.AppImage"
          cp "${deb[0]}" "$deb_asset"
          cp "${appimage[0]}" "$appimage_asset"
          chmod +x "$appimage_asset"

          test "$(dpkg-deb -f "$deb_asset" Architecture)" = amd64
          test "$(dpkg-deb -f "$deb_asset" Version)" = "$version"
          sudo apt-get install -y "$deb_asset"
          package=$(dpkg-deb -f "$deb_asset" Package)
          desktop=$(dpkg -L "$package" | awk '/[.]desktop$/')
          desktop-file-validate "$desktop"
          dbus-run-session -- xvfb-run -a bash scripts/linux-package-smoke.sh /usr/bin/quark-drive-lite-tauri linux-qa/deb.png
          sudo apt-get remove -y "$package"
          test ! -e /usr/bin/quark-drive-lite-tauri
          test ! -e "$desktop"

          dbus-run-session -- xvfb-run -a bash scripts/linux-package-smoke.sh "$appimage_asset" linux-qa/appimage.png
          (cd linux-packages && sha256sum *.AppImage *.deb > SHA256SUMS-Linux.txt)
      - name: Save Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: quark-drive-lite-linux-x64
          path: linux-packages/
          if-no-files-found: error
      - name: Save Linux smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: quark-drive-lite-linux-qa
          path: |
            .work/*smoke.json
            .work/weston.log
            linux-qa/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Test native Intel WKWebView and Tauri IPC
        if: matrix.os == 'macos-15-intel'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          test "$(uname -m)" = x86_64
          npm run verify:native
      - name: Build and validate macOS Intel package
        if: matrix.os == 'macos-15-intel'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          npm run build -- --bundles app -- --locked
          mkdir -p macos-intel-packages
          app="QuarkDriveLite.app"
          source_app=$(node -p "require('./src-tauri/tauri.conf.json').productName + '.app'")
          version=$(node -p "require('./package.json').version")
          archive="$PWD/macos-intel-packages/QuarkDriveLite-$version-macOS-x64.zip"
          smoke_dir=$(mktemp -d)
          app_pid=
          cleanup() {
            if [[ -n $app_pid ]]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            rm -rf "$smoke_dir"
          }
          trap cleanup EXIT
          mkdir -p "$smoke_dir/staging"
          staged_app="$smoke_dir/staging/$app"
          ditto --norsrc --noextattr --noqtn "target/release/bundle/macos/$source_app" "$staged_app"
          codesign --verify --deep --strict "$staged_app"
          ditto -c -k --norsrc --noextattr --keepParent "$staged_app" "$archive"
          unzip -t "$archive"
          install_dir="$smoke_dir/安装 测试"
          ditto -x -k "$archive" "$install_dir"
          installed_app="$install_dir/$app"
          codesign --verify --deep --strict "$installed_app"
          plist="$installed_app/Contents/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" = "$version"
          binary="$installed_app/Contents/MacOS/$executable"
          test "$(lipo -archs "$binary")" = x86_64

          QK_PROFILE_DIR="$smoke_dir/profile" "$binary" >"$smoke_dir/startup.log" 2>&1 &
          app_pid=$!
          for attempt in {1..20}; do
            test -f "$smoke_dir/profile/app.lock" && break
            kill -0 "$app_pid" 2>/dev/null || { cat "$smoke_dir/startup.log"; exit 1; }
            sleep 1
          done
          test -f "$smoke_dir/profile/app.lock"
          sleep 5
          kill -0 "$app_pid" 2>/dev/null || { cat "$smoke_dir/startup.log"; exit 1; }
          echo "Verified x86_64 app signature and startup from the extracted ZIP"
          (cd macos-intel-packages && shasum -a 256 *.zip > SHA256SUMS-macOS-x64.txt)
      - name: Save macOS Intel package
        if: matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@v4
        with:
          name: quark-drive-lite-macos-x64
          path: macos-intel-packages/
          if-no-files-found: error
      - name: Save macOS Intel smoke evidence
        if: always() && matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@v4
        with:
          name: quark-drive-lite-macos-x64-qa
          path: .work/native-smoke.json
          include-hidden-files: true
          if-no-files-found: warn
