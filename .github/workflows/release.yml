name: Automated 4-OS Release & Hub Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.1)'
        required: true
      channel:
        description: 'Release channel (stable / beta)'
        required: false
        default: 'stable'
        type: choice
        options: [stable, beta]
      min_version:
        description: 'Optional minimum recommended client version (e.g. 1.3.6)'
        required: false
        default: '1.3.6'

permissions:
  contents: read

concurrency:
  group: qdl-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-source:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release tag input
        id: tag
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo 'Expected a version tag such as v1.3.2.'
            exit 1
          fi
          echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          persist-credentials: false
      - name: Record commit and verify package version
        id: commit
        env:
          TAG_NAME: ${{ steps.tag.outputs.name }}
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_EVENT_NAME" == push && "$sha" != "$(git rev-parse "$GITHUB_SHA^{commit}")" ]]; then
            echo 'The release tag moved since the push event.'
            exit 1
          fi
          if [[ "$TAG_NAME" != "v$(node -p "require('./package.json').version")" ]]; then
            echo 'The release tag does not match package.json.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: release-source
    uses: ./.github/workflows/p0-compatibility.yml
    with:
      release_sha: ${{ needs.release-source.outputs.sha }}

  build-windows:
    needs: release-source
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Apply optional official build overlay
        env:
          OVERLAY_B64: ${{ secrets.QDL_PRIVATE_OVERLAY_B64 }}
        run: node -e "const fs=require('node:fs'),z=require('node:zlib');const b=(process.env.OVERLAY_B64||'').trim();if(b){fs.writeFileSync('crates/quark-core/src/hub.rs',z.gunzipSync(Buffer.from(b,'base64')));console.log('Applied official build overlay.');}"
      - run: npm run check:js
      - run: cargo test --workspace --locked
      - name: Build Windows NSIS Setup & Portable ZIP
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build -- --bundles nsis -- --locked
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $outDir = Join-Path $PWD "dist-release"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $nsisFiles = Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*-setup.exe"
          if ($nsisFiles.Count -ne 1) { throw "Expected 1 NSIS setup exe, found $($nsisFiles.Count)" }
          $setupDest = Join-Path $outDir "QuarkDriveLite-$version-Windows-x64-Setup.exe"
          Copy-Item $nsisFiles[0].FullName $setupDest -Force

          $exePath = Join-Path $PWD "target/release/quark-drive-lite-tauri.exe"
          $portableStage = Join-Path $env:TEMP "qdl-portable-$version"
          if (Test-Path $portableStage) { Remove-Item $portableStage -Recurse -Force }
          $stageInner = Join-Path $portableStage "夸克网盘极简版-v$version-便携版"
          New-Item -ItemType Directory -Force -Path $stageInner | Out-Null
          Copy-Item $exePath (Join-Path $stageInner "夸克网盘极简版.exe") -Force
          @"
          夸克网盘 · 极简版 v$version（Windows x64 便携版）
          ==========================================
          1. 双击「夸克网盘极简版.exe」即可运行，无需安装。
          2. 需要 Windows 10/11 系统自带的 Microsoft Edge WebView2 运行时。
          3. 如需开启在线更新与轻量前端热更新，可在设置中手动开启「连接作者服务器」。
          "@ | Set-Content -Path (Join-Path $stageInner "使用说明.txt") -Encoding UTF8

          $zipDest = Join-Path $outDir "QuarkDriveLite-$version-Windows-x64-Portable.zip"
          python -c "import zipfile, pathlib, sys; root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); zf=zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9); [zf.write(p, p.relative_to(root).as_posix()) for p in sorted(root.rglob('*')) if p.is_file()]; zf.close()" $portableStage $zipDest
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist-release/
          if-no-files-found: error

  build-linux:
    needs: release-source
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libfuse2 librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --ignore-scripts
      - name: Apply optional official build overlay
        env:
          OVERLAY_B64: ${{ secrets.QDL_PRIVATE_OVERLAY_B64 }}
        run: node -e "const fs=require('node:fs'),z=require('node:zlib');const b=(process.env.OVERLAY_B64||'').trim();if(b){fs.writeFileSync('crates/quark-core/src/hub.rs',z.gunzipSync(Buffer.from(b,'base64')));console.log('Applied official build overlay.');}"
      - run: npm run check:js
      - run: cargo test --workspace --locked
      - name: Build Linux DEB & AppImage
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          npm run build -- -- --locked
          mkdir -p dist-release
          version=$(node -p "require('./package.json').version")
          deb=(target/release/bundle/deb/*.deb)
          appimage=(target/release/bundle/appimage/*.AppImage)
          cp "${deb[0]}" "dist-release/QuarkDriveLite-$version-Linux-x64.deb"
          cp "${appimage[0]}" "dist-release/QuarkDriveLite-$version-Linux-x64.AppImage"
          chmod +x "dist-release/QuarkDriveLite-$version-Linux-x64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist-release/
          if-no-files-found: error

  build-macos:
    needs: release-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            bundles: app,dmg
          - os: macos-15-intel
            arch: x64
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: Apply optional official build overlay
        env:
          OVERLAY_B64: ${{ secrets.QDL_PRIVATE_OVERLAY_B64 }}
        run: node -e "const fs=require('node:fs'),z=require('node:zlib');const b=(process.env.OVERLAY_B64||'').trim();if(b){fs.writeFileSync('crates/quark-core/src/hub.rs',z.gunzipSync(Buffer.from(b,'base64')));console.log('Applied official build overlay.');}"
      - run: npm run check:js
      - run: cargo test --workspace --locked
      - name: Build macOS packages (${{ matrix.arch }})
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          MAC_BUNDLES: ${{ matrix.bundles }}
        run: |
          npm run build -- --bundles "$MAC_BUNDLES" -- --locked
          mkdir -p dist-release
          version=$(node -p "require('./package.json').version")
          source_app=$(node -p "require('./src-tauri/tauri.conf.json').productName + '.app'")
          stage=$(mktemp -d)
          ditto --norsrc --noextattr --noqtn "target/release/bundle/macos/$source_app" "$stage/QuarkDriveLite.app"
          codesign --verify --deep --strict "$stage/QuarkDriveLite.app"
          ditto -c -k --norsrc --noextattr --keepParent "$stage/QuarkDriveLite.app" "dist-release/QuarkDriveLite-$version-macOS-${{ matrix.arch }}.zip"
          rm -rf "$stage"
          if [[ "$MAC_BUNDLES" == *dmg* ]]; then
            shopt -s nullglob
            dmgs=(target/release/bundle/dmg/*.dmg)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo "Expected one macOS DMG, found ${#dmgs[@]}."
              exit 1
            fi
            cp "${dmgs[0]}" "dist-release/QuarkDriveLite-$version-macOS-${{ matrix.arch }}.dmg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist-release/
          if-no-files-found: error

  publish:
    needs: [release-source, compatibility, build-windows, build-linux, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: release-*
          merge-multiple: true
      - name: Generate unified SHA256SUMS.txt & rich Chinese Release Notes
        run: |
          cd all-artifacts
          sha256sum QuarkDriveLite-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          node - <<'EOF'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const ver = pkg.version;
          const today = new Date().toISOString().slice(0, 10);

          let section = `> 夸克网盘极简版 v${ver} 全平台正式发布。`;
          if (fs.existsSync('CHANGELOG.md')) {
            const md = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escaped = ver.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`## \\\[?v?${escaped}\\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n---\\n|\\n## |$)`);
            const m = md.match(re);
            if (m && m[1].trim()) section = m[1].trim();
          }

          const files = fs.readdirSync('all-artifacts');
          const sizeStr = (name) => {
            if (!files.includes(name)) return null;
            const mb = (fs.statSync(`all-artifacts/${name}`).size / 1048576).toFixed(2);
            return `${mb} MB`;
          };
          const rows = [
            ['Windows 10/11 (x64) 安装版', `QuarkDriveLite-${ver}-Windows-x64-Setup.exe`, 'NSIS 轻量安装版，支持中文向导、免管理员与干净卸载'],
            ['Windows 10/11 (x64) 便携版', `QuarkDriveLite-${ver}-Windows-x64-Portable.zip`, 'UTF-8 编码兼容，解压即运行，无需安装'],
            ['macOS Apple Silicon (arm64)', `QuarkDriveLite-${ver}-macOS-arm64.dmg`, '磁盘镜像安装版，拖入「应用程序」即可使用'],
            ['macOS Apple Silicon (arm64)', `QuarkDriveLite-${ver}-macOS-arm64.zip`, '压缩包版，解压即用，支持应用内原位升级'],
            ['macOS Intel (x64)', `QuarkDriveLite-${ver}-macOS-x64.zip`, 'Intel 芯片 Mac 压缩包版，解压后拖入「应用程序」'],
            ['Linux x64 (Debian / Ubuntu)', `QuarkDriveLite-${ver}-Linux-x64.deb`, '`sudo apt install ./QuarkDriveLite-' + ver + '-Linux-x64.deb`'],
            ['Linux x64 (通用便携版)', `QuarkDriveLite-${ver}-Linux-x64.AppImage`, '`chmod +x` 赋权后直接运行，支持应用内原位替换升级'],
          ];
          const expectedFiles = new Set([...rows.map((row) => row[1]), 'SHA256SUMS.txt']);
          const missing = [...expectedFiles].filter((file) => !files.includes(file) ||
            !fs.statSync(`all-artifacts/${file}`).isFile() ||
            fs.statSync(`all-artifacts/${file}`).size === 0);
          const unexpected = files.filter((file) => !expectedFiles.has(file));
          if (missing.length || unexpected.length) {
            throw new Error(`Release files mismatch. Missing: ${missing.join(', ')}. Unexpected: ${unexpected.join(', ')}.`);
          }

          const table = [
            '| 平台 | 安装包文件 | 体积 | 说明 |',
            '|---|---|---:|---|',
            ...rows.map(([p, f, d]) => `| **${p}** | \`${f}\` | ${sizeStr(f)} | ${d} |`),
          ].join('\n');

          const releaseBody = [
            `## 夸克网盘极简版 v${ver}（${today}）`,
            '',
            section,
            '',
            '---',
            '',
            '### 📦 全平台安装包下载对照表',
            '',
            table,
            '',
            '> 💡 **校验、交流与使用提示**：',
            '> - **强烈建议所有旧版本用户升级至最新正式版**；旧版本 Releases 仅用于历史存档（已去除与云服务器的一切关联）。',
            '> - **交流群（自愿加入）**：QQ 群 **`1054152586`**（夸克网盘项目交流群），欢迎一起沟通体验与建议，让项目越来越好用。',
            '> - 完整校验和见附件 `SHA256SUMS.txt`；已开启应用内可选更新服务的用户可直接校验 **Ed25519 签名 + SHA-256** 后一键下载升级。',
            '> - **macOS 首次启动提示**：开源未签名构建若提示「无法验证开发者」，在终端执行一次：',
            '>   ```sh',
            '>   xattr -dr com.apple.quarantine "/Applications/QuarkDriveLite.app"',
            '>   ```',
            '> - **隐私承诺**：更新、热更新与诊断通道默认关闭（未开启严格零外传）；开启后严格零 PII 脱敏，绝不采集文件名、本地路径、FID、直链、Cookie、Token 或 IP。',
          ].join('\n');

          fs.writeFileSync('release-notes.md', releaseBody, 'utf8');
          fs.writeFileSync('hub-changelog.txt', section.slice(0, 8000), 'utf8');
          EOF
      - name: Stage and verify Hub packages
        env:
          HUB_URL: ${{ secrets.QDL_HUB_URL || vars.QDL_HUB_URL }}
          HUB_DEPLOY_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
          MIN_VERSION: ${{ inputs.min_version || '1.3.6' }}
        run: node scripts/publish-hub-release.mjs stage
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-source.outputs.tag }}
          RELEASE_SHA: ${{ needs.release-source.outputs.sha }}
        run: |
          tag_commit=$(git ls-remote --exit-code origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" |
            awk 'NR == 1 { sha=$1 } /\^\{\}$/ { sha=$1 } END { print sha }')
          if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
            echo 'The release tag changed after verification.'
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "夸克网盘极简版 $TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" all-artifacts/* --clobber
          else
            gh release create "$TAG_NAME" all-artifacts/* --verify-tag \
              --title "夸克网盘极简版 $TAG_NAME" \
              --notes-file release-notes.md
          fi
      - name: Activate the complete Hub release
        env:
          HUB_URL: ${{ secrets.QDL_HUB_URL || vars.QDL_HUB_URL }}
          HUB_DEPLOY_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
          CHANNEL: ${{ inputs.channel || 'stable' }}
          MIN_VERSION: ${{ inputs.min_version || '1.3.6' }}
        run: node scripts/publish-hub-release.mjs activate
